<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aliança Park · Recuperação PAT v5.3.64</title>
<style>
html,body{height:100%;margin:0;background:#07131f;color:#e8f1f7;font:15px system-ui,sans-serif}
main{height:100%;display:grid;place-items:center}
section{width:min(520px,calc(100% - 32px));padding:24px;border:1px solid #294055;background:#0b1b2a}
h1{font-size:22px;margin:0 0 8px}p{color:#a9bac9;line-height:1.5}
code{color:#8ad0ae}button{min-height:44px;border:1px solid #4f82ff;background:#1d5fff;color:white;padding:0 16px;cursor:pointer}
</style>
<script src="./pat-freeze-guard-v5364.js?v=5.3.64"></script>
</head>
<body>
<main>
<section>
  <h1>Recuperando configuração local</h1>
  <p id="status">Removendo PAT inserido no estado do navegador e limpando somente caches Belavista…</p>
  <button id="go" type="button" hidden>Voltar ao painel</button>
</section>
</main>
<script>
(async()=>{
  const status=document.querySelector('#status');
  const go=document.querySelector('#go');

  try{
    const registrations=await navigator.serviceWorker?.getRegistrations?.()||[];
    await Promise.all(registrations.map(item=>item.unregister().catch(()=>false)));

    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(
        keys.filter(key=>/belavista/i.test(key)).map(key=>caches.delete(key))
      );
    }

    status.innerHTML=
      'Configuração recuperada. O valor de PAT foi retirado do estado local; '+
      'o navegador passa a usar apenas o nome <code>GITHUB_PAT</code> do segredo do Worker.';
  }catch(error){
    status.textContent='Configuração local recuperada; limpeza de cache parcial: '+error.message;
  }

  go.hidden=false;
  go.addEventListener('click',()=>{
    location.replace('/admin?patRecovery=v5364&ts='+Date.now());
  });

  setTimeout(()=>go.click(),700);
})();
</script>
</body>
</html>
