name: Deploy public leads page

on:
  push:
    branches: [main]
    paths:
      - 'public-leads.html'
      - 'public-leads.js'
      - 'public-lead-form.mjs'
      - 'public-leads.css'
      - 'firebase.mjs'
      - 'components.js'
      - 'state.js'
      - 'styles.css'
      - 'assets/**'
      - '.github/workflows/deploy-public-leads-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-leads-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public lead entrypoint
        run: |
          mkdir -p _site
          cp public-leads.html _site/index.html
          cp public-leads.js public-lead-form.mjs public-leads.css firebase.mjs components.js state.js styles.css _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
