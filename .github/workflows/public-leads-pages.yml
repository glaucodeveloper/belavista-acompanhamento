name: Publicar página comercial de lotes

on:
  push:
    branches: [main, master]
    paths:
      - 'public-leads.html'
      - 'public-leads.css'
      - 'public-leads.js'
      - 'public-lead-form.mjs'
      - 'firebase.mjs'
      - 'components.js'
      - 'state.js'
      - 'styles.css'
      - 'assets/model/alianca_park_masterplan_preview.glb'
      - 'scripts/build-public-pages.mjs'
      - '.github/workflows/public-leads-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-public-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
