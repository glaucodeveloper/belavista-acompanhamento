/* BELAVISTA_NGROK_SW_PURGE_V5372 */
(()=>{
  const ngrok=/\.ngrok-free\.dev$/i.test(location.hostname);
  if(!ngrok)return;

  globalThis.BELAVISTA_DISABLE_SERVICE_WORKER=true;

  const reloadKey='belavista.ngrok.sw.purged.v5372';
  if(sessionStorage.getItem(reloadKey)==='1')return;
  sessionStorage.setItem(reloadKey,'1');

  const purge=async()=>{
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      if('caches' in globalThis){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
      }
    }catch(error){
      console.warn('[Aliança Park v5.3.72] purge SW/cache parcial',error);
    }

    const next=new URL(location.href);
    next.searchParams.set('_bv','5372');
    location.replace(next.href);
  };

  purge();
})();
</script>

/* BELAVISTA_STAGE_RECORD_CENTER_CACHE_RESET_V1 */
(() => {
  if (!/^(?:localhost|127\.0\.0\.1)$/i.test(location.hostname)) return;
  const key = "belavista.map-original-pdf-perimeter.cache-reset.v3";
  if (sessionStorage.getItem(key) === "1") return;
  sessionStorage.setItem(key, "1");
  const clear = async () => {
    try {
      const registrations = await navigator.serviceWorker?.getRegistrations?.();
      await Promise.all((registrations || []).map((registration) => registration.unregister()));
      if (globalThis.caches) {
        await Promise.all((await caches.keys()).map((cacheKey) => caches.delete(cacheKey)));
      }
    } catch {}
    location.reload();
  };
  void clear();
})();
</script>
