/* BELAVISTA_NGROK_SW_PURGE_V5372 */
(()=>{
  const ngrok=/\.ngrok-free\.dev$/i.test(location.hostname);
  if(!ngrok)return;

  globalThis.BELAVISTA_DISABLE_SERVICE_WORKER=true;

  const reloadKey='belavista.ngrok.sw.purged.v5372';
  if(sessionStorage.getItem(reloadKey)==='1')return;
  sessionStorage.setItem(reloadKey,'1');

  const purge=async()=>{
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      if('caches' in globalThis){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));
      }
    }catch(error){
      console.warn('[Aliança Park v5.3.72] purge SW/cache parcial',error);
    }

    const next=new URL(location.href);
    next.searchParams.set('_bv','5372');
    location.replace(next.href);
  };

  purge();
})();
</script>
